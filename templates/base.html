<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Secure Vault{% endblock %}</title>
    <style>
        :root { color-scheme: light; font-family: Georgia, serif; --ink: #17352d; --muted: #6b7d76; --paper: #f8f6ef; --line: #cbd8d1; --accent: #d7653b; }
        * { box-sizing: border-box; }
        body { background: radial-gradient(circle at 85% 0, #d7e8df 0, #e9f0ed 33rem); color: var(--ink); margin: 0; min-height: 100vh; }
        header { align-items: center; background: var(--ink); color: #f7f4e9; display: flex; justify-content: space-between; padding: 18px 6%; }
        header a { color: inherit; text-decoration: none; }
        .brand { align-items: center; display: flex; font-size: 1.25rem; font-weight: bold; gap: 10px; letter-spacing: .04em; }
        .brand-mark { align-items: center; border: 1px solid #aec8bc; border-radius: 50%; display: inline-flex; font: bold .7rem Arial, sans-serif; height: 27px; justify-content: center; width: 27px; }
        nav { align-items: center; display: flex; gap: 18px; }
        nav span { color: #b9cdc4; font: .82rem Arial, sans-serif; }
        main { margin: 0 auto; max-width: 1120px; padding: 54px 6%; }
        h1 { font-size: clamp(2rem, 5vw, 4rem); line-height: 1; margin: 0 0 12px; }
        p { font-family: Arial, sans-serif; line-height: 1.5; }
        .eyebrow { color: var(--accent); font: bold .72rem Arial, sans-serif; letter-spacing: .14em; margin: 0 0 14px; text-transform: uppercase; }
        .intro { align-items: end; display: flex; justify-content: space-between; gap: 24px; margin-bottom: 30px; }
        .intro p { color: #4f665f; margin: 0; max-width: 520px; }
        .summary { display: flex; gap: 12px; margin-bottom: 26px; }
        .stat { background: rgba(248, 246, 239, .78); border: 1px solid var(--line); border-radius: 6px; min-width: 145px; padding: 15px 18px; }
        .stat strong { display: block; font-size: 1.4rem; }
        .stat span { color: var(--muted); font: .72rem Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
        .button, button { background: #d7653b; border: 0; border-radius: 5px; color: white; cursor: pointer; display: inline-block; font: bold .9rem Arial, sans-serif; padding: 12px 17px; text-decoration: none; }
        .button.secondary, button.secondary { background: #d9e5df; color: #17352d; }
        .button.danger, button.danger { background: transparent; color: #a93628; padding: 8px 0; }
        .vault-list { display: grid; gap: 14px; }
        .vault-row, .form-panel, .auth-panel { background: rgba(248, 246, 239, .9); border: 1px solid var(--line); border-radius: 7px; padding: 20px; }
        .vault-row { align-items: center; display: grid; grid-template-columns: 1.3fr 1fr auto; gap: 20px; transition: border-color .2s, transform .2s; }
        .vault-row:hover { border-color: #86a89b; transform: translateY(-2px); }
        .vault-row strong { display: block; font-size: 1.15rem; }
        .muted { color: var(--muted); font: .9rem Arial, sans-serif; }
        .search { background: rgba(248, 246, 239, .78); border: 1px solid var(--line); margin-bottom: 14px; max-width: 430px; }
        .actions { align-items: center; display: flex; gap: 15px; justify-content: end; }
        form.inline { display: inline; }
        label { display: block; font: bold .85rem Arial, sans-serif; margin: 16px 0 7px; }
        input { background: white; border: 1px solid #aebfb7; border-radius: 4px; font: 1rem Arial, sans-serif; padding: 12px; width: 100%; }
        .form-panel, .auth-panel { margin: 0 auto; max-width: 570px; }
        .form-actions { display: flex; gap: 12px; margin-top: 24px; }
        .alert { border-radius: 4px; font: .9rem Arial, sans-serif; margin-bottom: 16px; padding: 12px; }
        .alert.danger { background: #f8d8d0; color: #75261c; }
        .alert.success { background: #d2eadb; color: #205738; }
        .empty { border: 1px dashed #aebfb7; color: var(--muted); padding: 54px 40px; text-align: center; }
        .auth-shell { padding-top: 9vh; }
        .auth-panel h1 { font-size: 2.4rem; }
        .auth-link { text-align: center; }
        .password-line { align-items: center; display: flex; gap: 8px; }
        .password-line input { flex: 1; }
        .password-line button { background: #d9e5df; color: #17352d; padding: 12px; }
        @media (max-width: 700px) { .intro, .vault-row { align-items: stretch; display: flex; flex-direction: column; } .actions { justify-content: start; } header { padding: 16px 5%; } main { padding: 40px 5%; } .summary { flex-wrap: wrap; } }
    </style>
</head>
<body>
<header>
    <a class="brand" href="{{ url_for('index') if session.get('user_id') else url_for('login') }}"><span class="brand-mark">SV</span> SECURE VAULT</a>
    {% if session.get('user_id') %}
    <nav><span>{{ session.get('username') }}</span><form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary" type="submit">Log out</button></form></nav>
    {% endif %}
</header>
<main class="{% block main_class %}{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
