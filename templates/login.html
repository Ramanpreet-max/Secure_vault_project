{% extends "base.html" %}
{% block title %}Log in | Secure Vault{% endblock %}
{% block main_class %}auth-shell{% endblock %}
{% block content %}
<section class="auth-panel">
    <h1>Welcome back</h1><p>Unlock your encrypted vault.</p>
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="username">Username</label><input id="username" name="username" required>
        <label for="master_password">Master password</label><input id="master_password" name="master_password" type="password" required>
        <div class="form-actions"><button type="submit">Unlock vault</button></div>
    </form>
    <p class="auth-link">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
